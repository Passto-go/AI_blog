name = "mystyle"
main = "dist/_worker.js/index.js"
compatibility_date = "2025-07-18"
compatibility_flags = ["nodejs_compat"]
account_id = "2cc5e3ce9320936d151487ce230e8344"

# Cloudflare Workers（Git 构建）配置。
# Build command: npm run build  ->  输出到 ./dist
# Deploy command: npx wrangler deploy  ->  由本文件驱动
# 静态预渲染页（about/search/login/404）走 assets 直出，
# 动态路由（首页/文章/分类）由 _worker.js 现查 Supabase 渲染。
[assets]
directory = "./dist"

# 一键翻译（后台 /api/translate 调用）：走 OpenAI 兼容端点指向 Google Gemini。
# 免费层额度即可满足个人博客用量。
# TRANSLATE_API_KEY 是敏感项，不写在本文件：
#   Cloudflare 后台 → 本项目 → Settings → Variables and Secrets
#   → Add → Type 选 Secret → Name: TRANSLATE_API_KEY → Value: AIza...
#   → 保存后 Deployments 里 Retry deployment 生效（secret 仅在服务端可见，不会下发浏览器）。
[vars]
TRANSLATE_BASE_URL = "https://generativelanguage.googleapis.com/v1beta/openai"
TRANSLATE_MODEL = "gemini-3.8-flash"
